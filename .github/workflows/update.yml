name: Update Live TV Channels

on:
  schedule:
    # Runs every Monday at 02:00 UTC (keeps streams fresh weekly)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual trigger anytime in GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'generate.py'
      - 'sources.json'

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Channel Generator
        run: |
          python generate.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No channel updates detected."
          else
            git commit -m "Auto-update live channels and stream URLs [skip ci]"
            git push
          fi
